<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionSync</title>
  <link rel="stylesheet" href="../panel.css" />
  <style>
body { width:320px; margin:0; padding:18px; box-sizing:border-box; font:13px/1.5 'Segoe UI',system-ui,sans-serif; color:var(--v-text); background:var(--v-bg); }
h1 { font-size:20px; margin:0; color:var(--v-text); } h1 b { color:var(--v-accent-text); }
p.sub { color:var(--v-gold); margin:4px 0 16px; font-size:12px; }
label { display:block; margin:12px 0 5px; color:var(--v-text-2); font-weight:600; }
input,select { width:100%; box-sizing:border-box; padding:10px; color:var(--v-text); background:var(--v-field); border:1px solid var(--v-line); border-radius:8px; font:inherit; }
button { width:100%; padding:11px; margin-top:14px; border:0; border-radius:10px; background:var(--v-accent); color:var(--v-on-accent); font:inherit; font-weight:600; cursor:pointer; }
#repair { color:var(--v-accent-text); background:var(--v-field); border:1px solid var(--v-line); }
button:disabled { opacity:.6; cursor:wait; } :focus-visible { outline:2px solid var(--v-gold); outline-offset:2px; }
.msg { min-height:18px; margin-top:12px; } .ok {color:var(--v-ok);} .err {color:var(--v-danger);}
</style>
</head>
<body>
  <h1 class="vc-popup-brand" aria-label="VisionSync"><img class="vc-brand-on-dark" src="../brand/logo-small-wh.png" alt="" /><img class="vc-brand-on-light" src="../brand/logo-small-dark.png" alt="" /></h1>
  <p class="sub">VisionSync 0.20.4</p>
  <label for="theme">Aparência</label>
  <select id="theme"><option value="dark">Vision escuro</option><option value="light">Vision claro</option><option value="minimal">Vision minimalista</option></select>

  <label for="apiUrl">URL do sistema</label>
  <input id="apiUrl" type="text" placeholder="http://localhost:3001" />

  <label for="token">Token de acesso</label>
  <input id="token" type="password" placeholder="crm_..." />

  <button id="save">Salvar e testar conexão</button>
  <button id="repair" type="button">Reativar nas abas do WhatsApp</button>
  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
