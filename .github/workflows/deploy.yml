name: Deploy VisionSync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: visionsync-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy para a VPS
    runs-on: ubuntu-24.04

    steps:
      - name: Preparar SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' '${{ secrets.VPS_SSH_KEY }}' \
            > "$HOME/.ssh/visionsync_deploy"

          chmod 600 "$HOME/.ssh/visionsync_deploy"

          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Testar SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/visionsync_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH funcionando"

      - name: Executar deploy
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/visionsync_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo /usr/local/bin/deploy-visionsync"
